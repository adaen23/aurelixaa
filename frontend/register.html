<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AURELIXA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f0f8ff;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif;padding:20px}
        .container{max-width:400px;width:100%;background:white;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.08)}
        h1{font-size:2rem;color:#1a5a8c;margin-bottom:5px;text-align:center}
        .sub{color:#6a8aaa;text-align:center;margin-bottom:30px}
        input{width:100%;padding:14px;border:2px solid #d8e8f0;border-radius:10px;margin-bottom:15px;font-size:1rem;transition:0.3s}
        input:focus{outline:none;border-color:#4a90d9}
        .btn{width:100%;padding:16px;background:#4a90d9;color:white;border:none;border-radius:10px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:0.3s}
        .btn:hover{background:#3a7ac4}
        .link{color:#6a8aaa;text-align:center;margin-top:20px;display:block;font-size:0.9rem}
        .link a{color:#4a90d9;text-decoration:none}
        .error{color:#e74c3c;text-align:center;margin-top:10px;font-size:0.9rem}
    </style>
</head>
<body>
    <div class="container">
        <h1>AURELIXA</h1>
        <div class="sub">Create your account</div>
        <form id="registerForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="discord" placeholder="Discord Username (optional)">
            <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6">
            <button type="submit" class="btn">Register</button>
        </form>
        <div id="error" class="error"></div>
        <div class="link">Already have an account? <a href="login.html">Login</a></div>
        <div class="link" style="margin-top:10px;font-size:0.8rem;color:#8aabba">Need support? Contact @briefjes on Discord</div>
    </div>
    <script>
        const API_URL = 'aurelixa-api.onrender.com';
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const discord = document.getElementById('discord').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API_URL + '/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, discord })
                });
                const data = await res.json();
                if (!res.ok) {
                    document.getElementById('error').textContent = data.error || 'Registration failed';
                    return;
                }
                localStorage.setItem('token', data.token);
                window.location.href = 'dashboard.html';
            } catch (e) {
                document.getElementById('error').textContent = 'Network error';
            }
        });
    </script>
</body>
</html>
