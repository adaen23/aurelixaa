<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AURELIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;padding:20px;position:relative}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(139,92,246,0.05) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(236,72,153,0.05) 0%,transparent 60%);pointer-events:none;z-index:0}
        .container{max-width:380px;width:100%;background:rgba(17,24,39,0.6);border:1px solid rgba(255,255,255,0.04);border-radius:24px;padding:40px 32px;backdrop-filter:blur(10px);position:relative;z-index:1;transition:all 0.4s ease}
        .container:hover{border-color:rgba(139,92,246,0.1)}
        .back{color:#444466;text-decoration:none;font-size:0.8rem;display:inline-block;margin-bottom:16px;transition:color 0.3s}
        .back:hover{color:#8B5CF6}
        .logo{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#8B5CF6 0%,#EC4899 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;letter-spacing:-0.5px}
        .sub{color:#9ca3af;text-align:center;font-size:0.85rem;margin-bottom:24px;font-weight:400}
        .input-group{margin-bottom:14px}
        .input-group label{color:#9ca3af;font-size:0.75rem;display:block;margin-bottom:4px;font-weight:500}
        .input-group label .required{color:#e74c5e}
        .input-group input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#f3f4f6;font-size:0.9rem;transition:all 0.3s ease;font-family:inherit}
        .input-group input:focus{outline:none;border-color:rgba(139,92,246,0.3);box-shadow:0 0 30px rgba(139,92,246,0.04);background:rgba(255,255,255,0.04)}
        .input-group input::placeholder{color:#333355}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#8B5CF6 0%,#EC4899 100%);color:#fff;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.3s ease;font-family:inherit;box-shadow:0 4px 20px rgba(139,92,246,0.15);position:relative;overflow:hidden}
        .btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);transition:left 0.6s ease}
        .btn:hover::before{left:100%}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(139,92,246,0.25)}
        .error{color:#e74c5e;text-align:center;margin-top:10px;font-size:0.8rem}
        .success{color:#4eff6a;text-align:center;margin-top:10px;font-size:0.8rem}
        .footer{color:#444466;text-align:center;font-size:0.75rem;margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.03)}
        .footer a{color:#8B5CF6;text-decoration:none;transition:color 0.3s}
        .footer a:hover{color:#EC4899}
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back</a>
        <div class="logo">AURELIXA</div>
        <div class="sub">Create your account</div>
        <div class="input-group"><label>Email</label><input type="email" id="regEmail" placeholder="your@email.com"></div>
        <div class="input-group"><label>Discord Username <span class="required">*</span></label><input type="text" id="regDiscord" placeholder="@username"></div>
        <div class="input-group"><label>Password</label><input type="password" id="regPassword" placeholder="Min 6 characters"></div>
        <button class="btn" onclick="register()">Create Account</button>
        <div id="regError" class="error"></div><div id="regSuccess" class="success"></div>
        <div class="footer">Already have an account? <a href="login.html">Login</a></div>
    </div>
    <script>
        const API_URL='https://api.aurelixa.online';
        async function register(){const e=document.getElementById('regEmail').value,d=document.getElementById('regDiscord').value,p=document.getElementById('regPassword').value,err=document.getElementById('regError'),suc=document.getElementById('regSuccess');err.textContent='';suc.textContent='';if(!d.trim()){err.textContent='❌ Discord username is required';return}try{const res=await fetch(API_URL+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,discord:d})}),data=await res.json();if(!res.ok){err.textContent='❌ '+(data.error||'Registration failed');return}localStorage.setItem('token',data.token);localStorage.setItem('userEmail',data.user.email);suc.textContent='✅ Registration successful! Redirecting...';setTimeout(()=>window.location.href='dashboard.html',1500)}catch(e){err.textContent='❌ Network error'}}
        document.addEventListener('keydown',e=>{if(e.key==='Enter')register()});
    </script>
</body>
</html>
