<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AURELIXA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f0f8ff;color:#1a3a5c;font-family:'Segoe UI',sans-serif;padding:20px;min-height:100vh}
        .container{max-width:1000px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:2px solid #b8d4e8;margin-bottom:30px;flex-wrap:wrap;gap:15px}
        .header h1{font-size:2rem;color:#1a5a8c}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-bottom:30px}
        .stat-card{background:white;border:2px solid #b8d4e8;border-radius:12px;padding:20px;text-align:center}
        .stat-card .number{font-size:2.5rem;font-weight:800;color:#1a5a8c}
        .stat-card .label{color:#6a8aaa;font-size:0.8rem}
        .users-table{background:white;border-radius:12px;padding:20px;border:2px solid #b8d4e8;overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        th{text-align:left;padding:12px;color:#6a8aaa;border-bottom:2px solid #d8e8f0;font-weight:600}
        td{padding:12px;border-bottom:1px solid #d8e8f0}
        .plan-select{padding:6px 12px;border-radius:6px;border:2px solid #d8e8f0;font-size:0.9rem}
        .plan-select:focus{outline:none;border-color:#4a90d9}
        .btn-save{background:#4a90d9;color:white;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:0.8rem}
        .btn-save:hover{background:#3a7ac4}
        .btn-logout{background:transparent;color:#95a5a6;border:1px solid #d8e8f0;padding:8px 20px;border-radius:8px;cursor:pointer}
        .btn-logout:hover{background:#d8e8f0}
        .back-link{display:inline-block;color:#4a90d9;text-decoration:none;margin-right:15px}
        .back-link:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Admin Panel</h1>
            <div>
                <a href="dashboard.html" class="back-link">← Dashboard</a>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="number" id="totalUsers">0</div><div class="label">Total Users</div></div>
            <div class="stat-card"><div class="number" id="totalDeployments">0</div><div class="label">Total Deployments</div></div>
            <div class="stat-card"><div class="number" id="activeDeployments">0</div><div class="label">Active Links</div></div>
            <div class="stat-card"><div class="number" id="totalVisits">0</div><div class="label">Total Visits</div></div>
        </div>

        <div class="users-table">
            <h2 style="color:#1a5a8c;margin-bottom:15px;font-size:1.2rem;">👥 Users</h2>
            <div id="usersList">
                <div style="color:#8aabba;text-align:center;padding:20px;">Loading users...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'aurelixa-api.onrender.com';
        const token = localStorage.getItem('adminToken');
        if (!token) window.location.href = 'admin-login.html';

        async function loadStats() {
            try {
                const res = await fetch(API_URL + '/api/admin/stats', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                document.getElementById('totalUsers').textContent = data.totalUsers || 0;
                document.getElementById('totalDeployments').textContent = data.totalDeployments || 0;
                document.getElementById('activeDeployments').textContent = data.activeDeployments || 0;
                document.getElementById('totalVisits').textContent = data.totalVisits || 0;
            } catch (e) { console.error(e); }
        }

        async function loadUsers() {
            try {
                const res = await fetch(API_URL + '/api/admin/users', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                const list = document.getElementById('usersList');
                if (!data.users || data.users.length === 0) {
                    list.innerHTML = '<div style="color:#8aabba;text-align:center;padding:20px;">No users found</div>';
                    return;
                }
                let html = `
                    <table>
                        <tr>
                            <th>Email</th>
                            <th>Discord</th>
                            <th>Plan</th>
                            <th>Deploys Today</th>
                            <th>Action</th>
                        </tr>
                `;
                data.users.forEach(user => {
                    html += `
                        <tr>
                            <td>${user.email}</td>
                            <td>${user.discord || '-'}</td>
                            <td>
                                <select class="plan-select" data-userid="${user.id}" id="plan-${user.id}">
                                    <option value="free" ${user.plan === 'free' ? 'selected' : ''}>Free</option>
                                    <option value="pro" ${user.plan === 'pro' ? 'selected' : ''}>Pro</option>
                                    <option value="elite" ${user.plan === 'elite' ? 'selected' : ''}>Elite</option>
                                    <option value="lifetime" ${user.plan === 'lifetime' ? 'selected' : ''}>Lifetime</option>
                                </select>
                            </td>
                            <td>${user.dailyDeploys || 0}</td>
                            <td>
                                <button class="btn-save" onclick="updatePlan('${user.id}')">Save</button>
                            </td>
                        </tr>
                    `;
                });
                html += '</table>';
                list.innerHTML = html;
            } catch (e) { console.error(e); }
        }

        window.updatePlan = async (userId) => {
            const select = document.getElementById('plan-' + userId);
            const plan = select.value;
            try {
                const res = await fetch(API_URL + '/api/admin/user/' + userId + '/plan', {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ plan })
                });
                const data = await res.json();
                if (res.ok) {
                    alert('✅ Plan updated to ' + plan.toUpperCase());
                    loadStats();
                } else {
                    alert('❌ ' + (data.error || 'Update failed'));
                }
            } catch (e) {
                alert('❌ Network error');
            }
        };

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin-login.html';
        }

        loadStats();
        loadUsers();
    </script>
</body>
</html>
