<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AURELIXA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f0f8ff;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif;padding:20px}
        .container{max-width:400px;width:100%;background:white;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.08)}
        h1{font-size:2rem;color:#1a5a8c;margin-bottom:5px;text-align:center}
        .sub{color:#6a8aaa;text-align:center;margin-bottom:30px}
        input{width:100%;padding:14px;border:2px solid #d8e8f0;border-radius:10px;margin-bottom:15px;font-size:1rem}
        input:focus{outline:none;border-color:#4a90d9}
        .btn{width:100%;padding:16px;background:#4a90d9;color:white;border:none;border-radius:10px;font-size:1.1rem;font-weight:600;cursor:pointer}
        .btn:hover{background:#3a7ac4}
        .error{color:#e74c3c;text-align:center;margin-top:10px;font-size:0.9rem}
        .back-link{display:block;text-align:center;color:#6a8aaa;margin-top:20px;font-size:0.9rem}
        .back-link a{color:#4a90d9;text-decoration:none}
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Admin</h1>
        <div class="sub">Enter admin credentials</div>
        <form id="adminLoginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <div id="error" class="error"></div>
        <div class="back-link"><a href="dashboard.html">← Back to Dashboard</a></div>
    </div>
    <script>
        const API_URL = 'https://api.aurelixa.online';
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API_URL + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    document.getElementById('error').textContent = data.error || 'Invalid credentials';
                    return;
                }
                localStorage.setItem('adminToken', data.token);
                window.location.href = 'admin.html';
            } catch (e) {
                document.getElementById('error').textContent = 'Network error';
            }
        });
    </script>
</body>
</html>
