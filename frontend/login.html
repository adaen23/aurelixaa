<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AURELIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;padding:20px;position:relative}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.04) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(124,58,237,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
        .container{max-width:380px;width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:24px;padding:40px 32px;backdrop-filter:blur(10px);position:relative;z-index:1;transition:all 0.4s ease}
        .container:hover{border-color:rgba(124,58,237,0.08)}
        .back{color:#444466;text-decoration:none;font-size:0.8rem;display:inline-block;margin-bottom:16px;transition:color 0.3s}
        .back:hover{color:#a78bfa}
        .logo{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#7c3aed 0%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;letter-spacing:-0.5px}
        .sub{color:#666688;text-align:center;font-size:0.85rem;margin-bottom:24px;font-weight:400}
        .input-group{margin-bottom:14px}
        .input-group label{color:#666688;font-size:0.75rem;display:block;margin-bottom:4px;font-weight:500}
        .input-group input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e8e8e8;font-size:0.9rem;transition:all 0.3s ease;font-family:inherit}
        .input-group input:focus{outline:none;border-color:rgba(124,58,237,0.3);box-shadow:0 0 30px rgba(124,58,237,0.04);background:rgba(255,255,255,0.04)}
        .input-group input::placeholder{color:#333355}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#fff;border:none;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.3s ease;font-family:inherit;box-shadow:0 4px 20px rgba(124,58,237,0.15);position:relative;overflow:hidden}
        .btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);transition:left 0.6s ease}
        .btn:hover::before{left:100%}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(124,58,237,0.25)}
        .error{color:#e74c5e;text-align:center;margin-top:10px;font-size:0.8rem}
        .footer{color:#444466;text-align:center;font-size:0.75rem;margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.03)}
        .footer a{color:#a78bfa;text-decoration:none}
        .footer a:hover{color:#c4b5fd}
    </style>
</head>
<body>
    <div class="container">
        <a href="dashboard.html" class="back">← Back to Dashboard</a>
        <div class="logo">⚙️ Admin</div>
        <div class="sub">Enter admin credentials</div>
        <div class="input-group"><label>Username</label><input type="text" id="username" placeholder="admin"></div>
        <div class="input-group"><label>Password</label><input type="password" id="password" placeholder="••••••••"></div>
        <button class="btn" onclick="adminLogin()">Login</button>
        <div id="error" class="error"></div>
    </div>
    <script>
        const API_URL = 'https://api.aurelixa.online';
        async function adminLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const e = document.getElementById('error');
            e.textContent = '';
            try {
                const r = await fetch(API_URL + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const d = await r.json();
                if (!r.ok) {
                    e.textContent = '❌ ' + (d.error || 'Invalid credentials');
                    return;
                }
                localStorage.setItem('adminToken', d.token);
                window.location.href = 'admin.html';
            } catch (err) {
                e.textContent = '❌ Network error';
            }
        }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
    </script>
</body>
</html>
