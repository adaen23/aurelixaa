<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AURELIXA</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e1a;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Segoe UI',sans-serif;padding:20px}
        .container{max-width:400px;width:100%;background:#111b2e;border:1px solid #1a2a4a;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
        h1{font-size:2.5rem;color:#4a9eff;text-align:center;text-shadow:0 0 30px rgba(74,158,255,0.15)}
        .sub{color:#6a8aaa;text-align:center;margin-bottom:30px;font-size:0.95rem}
        .input-group{position:relative;margin-bottom:15px}
        .input-group label{color:#6a8aaa;font-size:0.8rem;display:block;margin-bottom:5px}
        .input-group input{width:100%;padding:14px;background:#0a0e1a;border:1px solid #1a2a4a;border-radius:10px;color:#c8d6e5;font-size:1rem;transition:0.3s}
        .input-group input:focus{outline:none;border-color:#4a9eff;box-shadow:0 0 20px rgba(74,158,255,0.1)}
        .btn{width:100%;padding:16px;background:#4a9eff;color:#0a0e1a;border:none;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:0.3s}
        .btn:hover{background:#6ab0ff;transform:scale(1.02)}
        .link{color:#6a8aaa;text-align:center;margin-top:20px;display:block;font-size:0.9rem}
        .link a{color:#4a9eff;text-decoration:none}
        .link a:hover{text-decoration:underline}
        .error{color:#ff4757;text-align:center;margin-top:10px;font-size:0.9rem}
    </style>
</head>
<body>
    <div class="container">
        <h1>AURELIXA</h1>
        <div class="sub">Login to your account</div>
        <form id="loginForm">
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn">🔓 Login</button>
        </form>
        <div id="error" class="error"></div>
        <div class="link">Don't have an account? <a href="register.html">Sign up</a></div>
        <div class="link" style="margin-top:10px;font-size:0.8rem;color:#4a5a6a">Contact @briefjes on Discord for support</div>
    </div>
    <script>
        const API_URL = 'https://api.aurelixa.online';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API_URL + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    document.getElementById('error').textContent = '❌ ' + (data.error || 'Login failed');
                    return;
                }
                localStorage.setItem('token', data.token);
                localStorage.setItem('userEmail', data.user.email);
                window.location.href = 'dashboard.html';
            } catch (e) {
                document.getElementById('error').textContent = '❌ Network error';
            }
        });
    </script>
</body>
</html>
