        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;color:#e8e8e8;font-family:'Inter',sans-serif;padding:24px;min-height:100vh;position:relative}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.04) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(124,58,237,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
        .container{max-width:600px;margin:0 auto;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:24px;padding:40px;backdrop-filter:blur(10px);position:relative;z-index:1;transition:all 0.4s ease}
        .container:hover{border-color:rgba(124,58,237,0.08)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:10px}
        .header h1{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#7c3aed 0%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header a{color:#444466;text-decoration:none;font-size:0.85rem;font-weight:500;transition:color 0.3s}
        .header a:hover{color:#a78bfa}
        .pricing-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .plan{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:14px;padding:20px 16px;text-align:center;transition:all 0.4s ease}
        .plan:hover{border-color:rgba(124,58,237,0.15);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.2)}
        .plan.popular{border-color:rgba(124,58,237,0.15);background:rgba(124,58,237,0.03)}
        .plan .badge{display:inline-block;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:1px 14px;border-radius:20px;font-size:0.5rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
        .plan .name{color:#e8e8e8;font-weight:700;font-size:1rem}
        .plan .price{color:#a78bfa;font-weight:900;font-size:1.8rem}
        .plan .price span{color:#666688;font-size:0.7rem;font-weight:400}
        .plan .features{color:#666688;font-size:0.7rem;margin:10px 0;line-height:1.8}
        .plan .btn{background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.3s ease;font-family:inherit;width:100%;box-shadow:0 4px 15px rgba(124,58,237,0.1)}
        .plan .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(124,58,237,0.2)}
        .plan .btn.outline{background:transparent;border:1px solid rgba(124,58,237,0.2);color:#a78bfa;box-shadow:none}
        .plan .btn.outline:hover{background:rgba(124,58,237,0.04);border-color:rgba(124,58,237,0.3)}
        .footer{color:#444466;text-align:center;font-size:0.75rem;margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.03)}
