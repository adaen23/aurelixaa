<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURELIXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;padding:20px;position:relative}
        body::before{content:'';position:fixed;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at 30% 20%,rgba(124,58,237,0.04) 0%,transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(124,58,237,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
        .container{max-width:420px;width:100%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:24px;padding:48px 36px;backdrop-filter:blur(10px);text-align:center;position:relative;z-index:1;transition:all 0.4s ease}
        .container:hover{border-color:rgba(124,58,237,0.1);box-shadow:0 0 60px rgba(124,58,237,0.02)}
        .logo{font-size:3.2rem;font-weight:900;background:linear-gradient(135deg,#7c3aed 0%,#a78bfa 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;margin-bottom:4px}
        .sub{color:#666688;font-size:0.95rem;margin-bottom:32px;font-weight:400}
        .sub span{color:#a78bfa;font-weight:600}
        .btn-group{display:flex;flex-direction:column;gap:10px}
        .btn{display:block;width:100%;padding:14px 20px;border-radius:12px;border:none;font-size:0.95rem;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;transition:all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);font-family:inherit;position:relative;overflow:hidden}
        .btn-primary{background:linear-gradient(135deg,#7c3aed 0%,#6d28d9 100%);color:#fff;box-shadow:0 4px 20px rgba(124,58,237,0.2)}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(124,58,237,0.35)}
        .btn-primary::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);transition:left 0.6s ease}
        .btn-primary:hover::before{left:100%}
        .btn-outline{background:transparent;color:#a78bfa;border:1.5px solid rgba(124,58,237,0.2)}
        .btn-outline:hover{background:rgba(124,58,237,0.04);border-color:rgba(124,58,237,0.3);transform:translateY(-2px)}
        .footer{color:#444466;font-size:0.75rem;margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.03)}
        .footer a{color:#a78bfa;text-decoration:none;transition:color 0.3s}
        .footer a:hover{color:#c4b5fd}
        .footer-links{display:flex;justify-content:center;gap:20px;margin-bottom:6px}
        .footer-links a{color:#444466;text-decoration:none;font-size:0.75rem;transition:color 0.3s}
        .footer-links a:hover{color:#a78bfa}
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">AURELIXA</div>
        <div class="sub">Grabber as a <span>Service</span></div>

        <div class="btn-group">
            <a href="login.html" class="btn btn-primary">Login</a>
            <a href="register.html" class="btn btn-outline">Create Account</a>
        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="features.html">Features</a>
                <a href="pricing.html">Pricing</a>
            </div>
            <span>Contact <a href="https://discord.com/users/briefjes">@briefjes</a> on Discord</span>
        </div>
    </div>
    <script>if(localStorage.getItem('token'))window.location.href='dashboard.html';</script>
</body>
</html>
